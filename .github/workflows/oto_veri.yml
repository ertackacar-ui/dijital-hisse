name: oto veri (dijital hisse)
# Hafta ici her 15 dakikada GitHub'in kendi sunucusunda veri.json uretir (dolar/lot/maliyet YOK) ve sayfayi gunceller.
on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oto-veri
  cancel-in-progress: false
jobs:
  veri:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: veri.json uret
        env:
          IZLEME_KLASOR: ${{ github.workspace }}
        run: python motor/izleme_guncelle.py
      - name: guvenlik taramasi (lot/maliyet sizintisi yok)
        run: |
          python - <<'PY'
          import json
          d = json.load(open("veri.json"))
          yasak = {"lot","maliyet","ana","deger","kz","kz_pct","bosluk","doluluk"}
          kotu = [h["t"] for h in d["hisseler"] if yasak & set(h)]
          assert not kotu and d.get("toplam") is None and d.get("gizli"), f"yasak alan: {kotu}"
          m = open("motor/ortak_veri.py").read()
          assert "satis_fiyati" not in m and "satilan_lot" not in m
          print("temiz")
          PY
      - name: commit & push
        run: |
          git config user.name "oto-veri"; git config user.email "oto-veri@users.noreply.github.com"
          git add veri.json
          git diff --cached --quiet && echo "degisiklik yok" && exit 0
          git commit -m "oto veri $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase -X theirs origin main && git push)
