<script>
const $=s=>document.querySelector(s), app=$("#app"); let D=null, DD=null, cekAcik=null;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const f2=n=>n==null?"—":n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=n=>n==null?"—":(n>0?"+":"")+n.toFixed(1)+"%";
const cls=n=>n==null?"":(n>0?"up":n<0?"dn":"");
const usd=n=>n==null?"—":"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const BASLIK={ozet:"Piyasa Kokpiti",hisse:"Hisseler",pusu:"Pusu ve Kartopu",bilanco:"Bilanço Takvimi",haber:"Haber ve Analist",ajan:"Ajanlar",midas:"HEDGE FUND",alsat:"Al / Sat Masası",rontgen:"360° Röntgen"};
const ANA_SAYFALAR=["alsat","midas","rontgen","ajan","ozet","hisse","pusu","bilanco","haber"];
// Veri kaynagi: internette (github.io) her zaman gizli veri.json; yerel sunucuda lot/K-Z + Midas aynali veri_tam.json (yoksa veri.json)
const YEREL=!/github\.io$/.test(location.hostname)&&!/[?&]gizli=1/.test(location.search), KAYNAK=YEREL?"veri_tam.json":"veri.json";

// Tema, gizleme, menü
document.documentElement.setAttribute("data-theme",ls.get("dh-tema")||"dark");
$("#temaBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);ls.set("dh-tema",t)};
function gizleYaz(){const g=ls.get("dh-gizli")==="1";app.classList.toggle("gizli",g);$("#gizleBtn span").textContent=g?"Tutarları Göster":"Tutarları Gizle"}
$("#gizleBtn").onclick=()=>{ls.set("dh-gizli",ls.get("dh-gizli")==="1"?"0":"1");gizleYaz()}; gizleYaz();
const mobil=()=>matchMedia("(max-width:860px)").matches;
if(ls.get("dh-dar")==="1"&&!mobil())app.classList.add("dar");
if(ls.get("dh-detay")!=="0")app.classList.add("detayAcik");
$("#detayBtn").onclick=()=>{app.classList.toggle("detayAcik");ls.set("dh-detay",app.classList.contains("detayAcik")?"1":"0")};
matchMedia("(max-width:860px)").addEventListener("change",e=>{if(e.matches){app.classList.remove("dar")}else{app.classList.remove("acik")}});
$("#logoBtn").onclick=()=>{if(mobil())app.classList.toggle("acik");else{app.classList.toggle("dar");ls.set("dh-dar",app.classList.contains("dar")?"1":"0")}};
$("#perde").onclick=()=>app.classList.remove("acik");
document.querySelectorAll(".nv").forEach(b=>{const t=b.querySelector("span");if(t&&!b.title)b.title=t.textContent});
document.querySelectorAll(".nv[data-v]").forEach(b=>b.onclick=()=>{goster(b.dataset.v);app.classList.remove("acik")});
function goster(v){if(!ANA_SAYFALAR.includes(v))v="alsat";if(["ozet","hisse","pusu","bilanco","haber"].includes(v)){app.classList.add("detayAcik");ls.set("dh-detay","1")}document.querySelectorAll(".nv[data-v]").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v));document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));$("#baslik").textContent=BASLIK[v];ls.set("dh-view",v);if(typeof vitrinBagla==="function"&&D)vitrinBagla()}

const VIX_AD={"TAM KİLİT":"KORKU · dip avı","KORKU":"KORKU · dip avı","YALNIZ 1. LİG":"TEMKİN","TEMKİN":"TEMKİN","AÇIK":"SAKİN","SAKİN":"SAKİN"}; // VIX alim yasagi degil, mod etiketidir
const VIX_CLS={"TAM KİLİT":"bad","KORKU":"bad","YALNIZ 1. LİG":"warn","TEMKİN":"warn","AÇIK":"good","SAKİN":"good"};
function vixChip(v){const r=v.rejim;return `<span class="chip ${VIX_CLS[r]||"warn"}">VIX ${v.deger??"—"} · ${VIX_AD[r]||r}</span>`}
function dkOnce(iso){const m=Math.round((Date.now()-new Date(iso))/60000);return m<1?"az önce":m<60?m+" dk önce":Math.round(m/60)+" sa önce"}

function cizOzet(){
  const T=D.toplam||null, pa=D.para_akisi||{sektorler:[],taraf:"—",rejim:"—"}, eski=(Date.now()-new Date(D.guncelleme))>2*3600e3;
  const g=t=>D.hisseler.find(h=>h.t===t)||{}, voo=g("VOO"), qqq=g("QQQ");
  const ustEma=D.hisseler.filter(h=>h.ema21==="ÜST").length, donus=D.hisseler.filter(h=>h.puan>=3).length;
  const canliSatir=h=>h.canli!=null?`${h.t} ${f2(h.canli)} <span class="${cls(h.canli_degisim)}">(${pc(h.canli_degisim)} 🌙)</span>`:`${h.t} ${f2(h.fiyat)}`;
  const hero=T?`<div class="card hero"><div class="k">Toplam Hisse Portföyü</div><div class="v">${pc(T.tum.kz_pct)}</div><div class="s">${D.gizli?"":`<span class="para">${T.tum.deger!=null?usd(T.tum.deger)+" · K/Z "+usd(T.tum.kz):""}</span> `}1. Lig ${pc(T.lig1.kz_pct)} · 2. Lig ${pc(T.lig2.kz_pct)}</div></div>`
    :`<div class="card hero"><div class="k">Piyasa Nabzı</div><div class="v" style="font-size:19px">${canliSatir(qqq)} · ${canliSatir(voo)}</div><div class="s">Kapanış QQQ ${f2(qqq.fiyat)} (${pc(qqq.d1)}) · VOO ${f2(voo.fiyat)} (${pc(voo.d1)}) · EMA21 üstü ${ustEma}/${D.hisseler.length} · Dönüş 3+/4: ${donus}</div></div>`;
  const yakin=D.hisseler.filter(h=>h.pusu_mesafe!=null).sort((a,b)=>Math.abs(a.pusu_mesafe)-Math.abs(b.pusu_mesafe)).slice(0,4);
  const mayin=D.bilanco.filter(b=>b.mayin), mm=D.makro_mayin||[], eg=D.vix_egri&&D.vix_egri.yapi!=="VERİ YOK"?D.vix_egri:null;
  const kk=karar();
  $("#v-ozet").innerHTML=yonKarti(kk)+`
  <div class="grid kokpit">
    ${hero}
    <div class="card"><div class="k">VIX Rejimi</div><div class="v ${VIX_CLS[D.vix.rejim]==="good"?"up":VIX_CLS[D.vix.rejim]==="bad"?"dn":""}">${D.vix.deger??"—"}</div><div class="s">${VIX_AD[D.vix.rejim]||D.vix.rejim}${eg?` · <b class="${eg.yapi.includes("BACKWARDATION")?"dn":"up"}">${eg.yapi}</b> (9D ${eg.vix9d??"—"} · 3M ${eg.vix3m??"—"})`:""}</div></div>
    <div class="card"><div class="k">10Y Tahvil · DXY</div><div class="v" style="font-size:19px">${D.tnx??"—"}% · ${D.dxy??"—"}</div><div class="s">Tahvil Faizi · Dolar Endeksi</div></div>
    <div class="card"><div class="k">EMA21 Üstü</div><div class="v ${ustEma>=D.hisseler.length/2?"up":"dn"}">${ustEma}/${D.hisseler.length}</div><div class="s">Dönüş 3+/4: ${donus} Hisse</div></div>
    <div class="card"><div class="k">14 Gün Mayın</div><div class="v ${mayin.length+mm.length?"dn":""}">${mayin.length+mm.length}</div><div class="s">${mayin.length} Bilanço · ${mm.length} Makro${mm.length?" · "+mm.map(x=>x.ad+" "+x.kalan+" gün").join(", "):""}</div></div>
    <div class="card"><div class="k">Para Akışı</div><div class="v" style="font-size:17px;font-family:var(--sans)">${pa.taraf}</div><div class="s">${pa.rejim}<br>${pa.sektorler.slice(0,3).map(s=>s.etf+" "+pc(s.rs)).join(" · ")}</div></div>
    <div class="card"><div class="k">Son Güncelleme</div><div class="v" style="font-size:17px;font-family:var(--sans)">${dkOnce(D.guncelleme)}${eski?' <span class="chip warn">Veri Eski</span>':""}</div><div class="s">${new Date(D.guncelleme).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · Kesin Kapanış ${D.kesin_kapanis}</div></div>
  </div>
  <h2>Pusuya En Yakın</h2><div class="list">${yakin.map(h=>`<div class="row"><span class="t">${h.t}</span><span class="d">Pusu ${h.pusu_yakin} · Kapanış ${f2(h.fiyat)}${h.canli!=null?" · 🌙 "+f2(h.canli):""} · Dönüş ${h.puan}/4 · RSI ${h.rsi}</span><span class="r ${h.pusu_mesafe<0?"dn":""}">${pc(h.pusu_mesafe)}</span></div>`).join("")}</div>
  <h2>Mayınlar · 14 Gün</h2><div class="list">${[...mayin.map(b=>`<div class="row"><span class="t">${b.t}</span><span class="d">Bilanço ${b.tarih}</span><span class="chip bad">💣 ${b.kalan} gün</span></div>`),...mm.map(x=>`<div class="row"><span class="t">MAKRO</span><span class="d">${x.ad} ${x.tarih}</span><span class="chip warn">🏛 ${x.kalan} gün</span></div>`)].join("")||'<div class="boş">Önümüzdeki 14 günde bilanço veya makro mayın yok.</div>'}</div>`;
  yonBagla($("#v-ozet"));
}
// 🟢🔴 Midas AL/SAT vitrini + 💵 aylik katki defteri (yalniz yerel sunucu / sifreli ayna; github.io gizli kopyasinda yoktur)
function vitrin(){
  const A=D.alsat, M=D.midas; if(!A||!M)return "";
  const K=M.kasa, CF=A.cark_fis||[], yok=!A.al.length&&!A.sat.length&&!CF.length;
  const fisAl=a=>`<div class="fis al${a.kilit?" kilit":""}"><div class="b">🟢 MİDAS'TA AL: ${a.t} · ${a.tur||"PUSU AL"}${a.skor!=null?` · Dip Skoru ${a.skor}/4`:""}${a.uyari?` <span class="chip warn">${a.uyari}</span>`:""}</div><span><b>Limit Fiyat</b>${usd(a.limit)}</span><span><b>Alınacak Net Tutar</b>${usd(a.tutar)}</span><span><b>Net Lot</b>${a.lot}</span><span><b>Kaynak</b>${a.kaynak}</span><div class="g">Gerekçe: ${a.gerekce}</div></div>`;
  const fisCark=c=>c.tur.includes("SAT")?`<div class="fis sat" style="border-width:2px"><div class="b">${c.tur}: ${c.t}</div><span><b>Limit Fiyat</b>${usd(c.limit)}</span><span><b>Satılacak Lot</b>${c.lot}</span><span><b>Geri Alınan Ana Para</b>${usd(c.tutar)}</span><span><b>Bedava Kalan Lot</b>+${c.bedava}</span><div class="g">Gerekçe: ${c.gerekce}</div></div>`

function karar(){
  const p=new Intl.DateTimeFormat("tr-TR",{timeZone:"Europe/Istanbul",hour:"2-digit",minute:"2-digit",weekday:"long",hour12:false}).formatToParts(new Date());
  const g=o=>p.find(x=>x.type===o).value, dk=parseInt(g("hour"))*60+parseInt(g("minute")), gun=g("weekday");
  const haftaSonu=gun==="Cumartesi"||gun==="Pazar", acik=!haftaSonu&&(dk>=990||dk<5), pzt=gun==="Pazartesi";
  const sabah=!acik&&dk>=720&&dk<990&&!haftaSonu; // TSI 12:00-16:30: ABD acilisi oncesi haber turu
  let ajan, hedef, neden, cmd;
  if(acik){ajan=0;hedef="Seans Açık: 1. Ajan ile anlık durum, alarm çaldıysa 9. Ajan";neden="ABD seansı açık. Alarm yoksa kar_kalkani.py ile anlık bakış; alarm varsa Ajanlar'daki alarm kutusunu kullan.";cmd=PY+"kar_kalkani.py"}
  else if(sabah){ajan=9;hedef="ABD açılışı öncesi: 10. Ajan ile gündemi oku";neden="Öğleden sonra, seans henüz açılmadı. Önce haber ve analist turu, sonra 1. Ajan kapanış tablosu.";cmd=PY+"haber_istihbarat.py"}
  else{ajan=0;hedef="1. Ajan — Kesin Kapanış Kontrolü (--kapanis)";neden=(haftaSonu?"Hafta sonu":"ABD seansı kapalı")+". Kesinleşmiş 1G kapanışı pusu eşikleri ve EMA21 guard ile oku.";cmd=PY+"kar_kalkani.py --kapanis"}
  const ekstra=pzt?[1,4,5]:[];
  return {ajan,ekstra,hedef,neden,cmd,acik,gun,pzt,saat:g("hour")+":"+g("minute")};
}

// Internette: veri_tam.enc (AES-GCM) yalnizca bu cihazda girilen sifreyle cozulur; sifre cihazda kalir (localStorage), sunucuya gitmez
async function anahtar(sifre,salt){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(sifre),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"])}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function aynaCoz(sifre){
  const r=await fetch("veri_tam.enc?t="+Date.now(),{cache:"no-store"}); if(!r.ok)throw new Error("veri_tam.enc yok (HTTP "+r.status+")");
  const e=await r.json(); const k=await anahtar(sifre,b64(e.salt));
  const acik=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},k,b64(e.ct));
  return JSON.parse(new TextDecoder().decode(acik));
}

// 🔔 Seviye temasi bandi: pusu altinda (yesil), +%2 menzilde (kehribar), kartopuya %3 yakin (kirmizi)
function cizBant(){
  const b=$("#bant"), H=D.hisseler.filter(h=>!h.veri_yok);
  const alt=H.filter(h=>h.pusu_mesafe!=null&&h.pusu_mesafe<0), yakin=H.filter(h=>h.pusu_mesafe!=null&&h.pusu_mesafe>=0&&h.pusu_mesafe<=2), kar=H.filter(h=>h.kartopu_mesafe!=null&&h.kartopu_mesafe<=3);
  const cip=(h,c,tx)=>`<span class="chip ${c}" data-cek="${h.t}" title="Çekmeceyi aç">${h.t} ${tx}</span>`, m=mobil();
  const parca=[...alt.map(h=>cip(h,"yesil",m?`${f2(h.canli??h.fiyat)} ▼ pusu ${h.pusu_yakin}`:`${f2(h.canli??h.fiyat)} ▼ Pusu ${h.pusu_yakin} (${pc(h.pusu_mesafe)})`)),
    ...yakin.map(h=>cip(h,"kehribar",m?`${f2(h.canli??h.fiyat)} ≈ pusu ${h.pusu_yakin}`:`${f2(h.canli??h.fiyat)} ≈ Pusu ${h.pusu_yakin} (${pc(h.pusu_mesafe)})`)),
    ...kar.map(h=>cip(h,"kirmizi",m?`${f2(h.canli??h.fiyat)} ▲ kartopu ${h.kartopu}`:`${f2(h.canli??h.fiyat)} ▲ Kartopu ${h.kartopu} (${h.kartopu_mesafe<=0?"Aşıldı":h.kartopu_mesafe.toFixed(1)+"% kaldı"})`))];
  b.hidden=false; b.innerHTML=`<span class="bk">Seviye Teması</span>`+(parca.join("")||`<span class="boş" style="padding:0">Temas yok</span>`);
  b.querySelectorAll("[data-cek]").forEach(e=>e.onclick=()=>acCekmece(e.dataset.cek));

// 📊 Derin istatistik & gelecek rotasi cekmecesi (derin.json + veri.json + ozet_tr)
function acCekmece(t){
  cekAcik=t; const h=D.hisseler.find(x=>x.t===t)||{}, d=(DD&&DD.hisseler&&DD.hisseler[t])||null, hb=(D.haber&&D.haber.hisse&&D.haber.hisse[t])||null;
  const g=v=>v==null?"—":f2(v), kv=(a)=>`<div class="kv">${a.map(([k,v])=>`<span>${k}</span><b>${v}</b>`).join("")}</div>`;
  const ozet=((D.ozet_tr&&D.ozet_tr.maddeler)||[]).filter(m=>new RegExp("(^|[^A-Z])"+t.replace("-","[-.]")+"([^A-Z]|$)").test(m)).slice(0,4);
  let html=`<div class="sec"><div class="k">Teknik Durum</div>${kv([["Fiyat (kapanış)",g(h.fiyat)+(h.canli!=null?" · 🌙 "+g(h.canli):"")],["Dönüş Puanı",(h.puan??"—")+"/4"],["EMA21 / EMA50 / SMA200",`${h.ema21||"—"} / ${h.ema50||"—"} / ${h.sma200||"—"}`],["RSI(14)",h.rsi??"—"],["OBV",h.obv_ust?"Giriş ↑":"Çıkış ↓"],["Pusu",h.pusu_yakin?`${h.pusu_yakin} (${pc(h.pusu_mesafe)})`:"—"],["Kartopu",h.kartopu?`${h.kartopu} (${h.kartopu_mesafe}% kaldı)`:"—"]])}</div>`;
  if(!d) html+=`<div class="sec"><div class="boş">📊 Derin istatistik (${DD?"bu hisse için":"derin.json"}) henüz yok; günde iki kez yenilenir.</div></div>`;
  else if(d.veri_yok) html+=`<div class="sec"><div class="boş">Derin istatistik VERİ YOK.</div></div>`;
  else{
    const v=d.vwap, o=d.opsiyon, hm=d.harmoni, m=d.mc30, w=d.ws12, a=d.adil24;
    html+=`<div class="sec"><div class="k">Hacim ve Gün İçi</div>${kv([["RVOL (20G)",d.rvol??"—"],["UDVR alıcı/satıcı",d.udvr??"—"],["Emilim mumu",d.emilim&&d.emilim.length?d.emilim.join(", "):"yok"],["VWAP",v?`${g(v.deger)} (${pc(v.uzak)})`:"—"],["Açılış boşluğu",v?pc(v.gap):"—"],["ORB 30 dk",v?`${g(v.orb[0])} – ${g(v.orb[1])}`:"—"]])}</div>`;
    html+=`<div class="sec"><div class="k">Opsiyon Duvarları ${o?"· vade "+o.vade:""}</div>${o?kv([["Put duvarı (destek)",g(o.put)],["Call duvarı (direnç)",g(o.call)],["Max pain",g(o.max_pain)],["Beklenen hareket (ATM)","±"+(o.hareket??"—")+"%"]]):'<div class="boş">VERİ YOK</div>'}</div>`;
    html+=`<div class="sec"><div class="k">Harmoni · VPOC · Fibonacci</div>${hm?kv([["MTF Harmoni (15m·1h·1d·1wk)",`${hm.puanlar.map(p=>p==null?"—":p?"↑":"↓").join(" ")} = ${hm.skor}/4`],["VPOC (1Y hacim düğümü)",g(hm.vpoc)],["Fib %50 / %61.8",`${g(hm.fib50)} / ${g(hm.fib618)}`],["Çelik destek",hm.celik.length?hm.celik.join("; "):"yok"]]):'<div class="boş">VERİ YOK</div>'}</div>`;
    html+=`<div class="sec"><div class="k">📊 Gelecek Rotası</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">30G Monte Carlo (10.000 yol)</div>${m?`<div class="rota"><div><small>%5 dip</small>${g(m.dip)}</div><div><small>medyan</small>${g(m.medyan)}</div><div><small>%95 tavan</small>${g(m.tavan)}</div></div>`:'<div class="boş">VERİ YOK</div>'}
      <div style="font-size:12px;color:var(--muted);margin:8px 0 4px">12A Wall Street koridoru${w?` · ${w.n||"—"} analist · ${w.tavsiye||""}${w.dagilim?` (${w.dagilim.strong_buy}/${w.dagilim.buy}/${w.dagilim.hold}/${w.dagilim.sell})`:""}`:""}</div>${w?`<div class="rota"><div><small>en düşük</small>${g(w.dusuk)}</div><div><small>ortalama · ${pc(w.potansiyel)}</small>${g(w.ortalama)}</div><div><small>en yüksek</small>${g(w.yuksek)}</div></div>`:'<div class="boş">VERİ YOK</div>'}
      <div style="font-size:12px;color:var(--muted);margin:8px 0 4px">24A adil değer rotası${a?" · "+a.yontem:""}</div>${a?`<div class="rota"><div><small>muhafazakâr</small>${g(a.muhafazakar)}</div><div><small>baz</small>${g(a.baz)}</div><div><small>boğa</small>${g(a.boga)}</div></div>`:'<div class="boş">VERİ YOK</div>'}
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px">Rota tahmin değil, olasılık ve konsensüs haritasıdır; alım kararı VIX kilidine tabidir.</div></div>`;
  }
  html+=`<div class="sec"><div class="k">Türkçe Haber / Analist Özeti</div>${ozet.length?`<ul>${ozet.map(m=>`<li>${m}</li>`).join("")}</ul>`:""}${hb?(hb.potansiyel!=null?`<div style="font-size:13px;margin-top:6px">Analist hedef ${f2(hb.hedef)} · ${pc(hb.potansiyel)} · ${hb.tavsiye||""}</div>`:"")+`<ul>${hb.basliklar.slice(0,4).map(x=>`<li>${x.etiket} — ${x.baslik}</li>`).join("")}</ul>`:""}${!ozet.length&&!hb?'<div class="boş">Bu hisse için özet yok.</div>':""}</div>`;
  $("#cekBaslik").textContent=t+(h.kalkan?" 🛡":"")+(h.muaf?" 🏰":""); $("#cekIcerik").innerHTML=html; $("#cekmece").classList.add("on"); $("#cekPerde").classList.add("on");
}

let yukleniyor=false;
function haber(m){const h=$("#yenileHaber");h.textContent=m;h.hidden=false;clearTimeout(haber.t);haber.t=setTimeout(()=>h.hidden=true,4000)}
async function yukle(elle){
  if(yukleniyor)return; yukleniyor=true; const b=$("#yenileBtn"); b.disabled=true; b.textContent="⟳ Yenileniyor…";
  const ac=new AbortController(), zaman=setTimeout(()=>ac.abort(),10000); // 10 sn'de vazgeç, ekranı boş bırakma
  try{let r=await fetch(KAYNAK+"?t="+Date.now(),{cache:"no-store",signal:ac.signal});
    if(!r.ok&&KAYNAK!=="veri.json")r=await fetch("veri.json?t="+Date.now(),{cache:"no-store",signal:ac.signal}); // yerelde veri_tam.json yoksa gizli veriye dus
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json(); if(!d||!Array.isArray(d.hisseler)||!d.hisseler.length)throw new Error("boş veri");
    const yeni=!D||d.guncelleme!==D.guncelleme; D=d; ciz(); if(elle)haber(yeni?"✓ Yeni veri geldi":"✓ Sunucuda daha yeni veri yok; ekran güncel");
    fetch("derin.json?t="+Date.now(),{cache:"no-store"}).then(x=>x.ok?x.json():null).then(x=>{if(x&&x.hisseler){DD=x;if(cekAcik)acCekmece(cekAcik)}}).catch(()=>{})}
  catch(e){const neden=e.name==="AbortError"?"zaman aşımı (bağlantı yavaş)":e.message;
    if(D){$("#altBaslik").textContent=`Yenilenemedi: ${neden} · ekranda ${dkOnce(D.guncelleme)} verisi var`}
    else{$("#altBaslik").textContent="veri.json okunamadı: "+neden;$("#v-ozet").innerHTML=`<div class="boş">⚠️ Veri alınamadı (${neden}). İnternet bağlantısını kontrol edip ⟳ Yenile'ye basın.</div>`}}
  finally{clearTimeout(zaman); yukleniyor=false; b.disabled=false; b.textContent="⟳ Yenile"}
}
$("#yenileBtn").onclick=()=>yukle(true);
if(YEREL){const k=$("#zilKutu"),z=$("#zilBtn"),p=$("#zilPanel"),t=$("#zilTest");k.hidden=false;
  z.onclick=async()=>{p.hidden=!p.hidden;if(!p.hidden){try{const r=await api("/api/bildirim/kanal");$("#zilKanal").textContent=r.kanal}catch(e){$("#zilKanal").textContent="Kanal alınamadı: "+e.message}}};
  document.addEventListener("click",e=>{if(!k.contains(e.target))p.hidden=true});
  t.onclick=async()=>{t.disabled=true;t.textContent="⏳ Gönderiliyor…";try{const r=await api("/api/bildirim-test",{method:"POST"});haber(`🔔 Test gönderildi · Mac ${r.mac?"✓":"✗"} · iPhone ntfy ${r.ntfy?"✓":"✗"}`)}catch(e){haber("Bildirim gönderilemedi: "+e.message)}finally{t.disabled=false;t.textContent="📱 Telefona Test Bildirimi Gönder"}}}
goster(ANA_SAYFALAR.includes(ls.get("dh-view"))?ls.get("dh-view"):"alsat"); yukle(); setInterval(yukle,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)yukle()}); // telefonda uygulamaya dönünce hemen yenile
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  let yenilendi=false; navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!yenilendi){yenilendi=true;location.reload()}});
}
